<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="background" x1="0" y1="0" x2="1200" y2="430">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="50%" stop-color="#0B1026"/>
    <stop offset="100%" stop-color="#080817"/>
  </linearGradient>

  <linearGradient id="nameGradient" x1="70" y1="0" x2="500" y2="0">
    <stop offset="0%" stop-color="#67E8F9"/>
    <stop offset="45%" stop-color="#60A5FA"/>
    <stop offset="100%" stop-color="#F472B6"/>
  </linearGradient>

  <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>

  <radialGradient id="coreGlow">
    <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.55"/>
    <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="smallGlow">
    <feGaussianBlur stdDeviation="3"/>
  </filter>

</defs>


