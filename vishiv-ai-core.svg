<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560">
    <stop offset="0%" stop-color="#030712"/>
    <stop offset="50%" stop-color="#07101F"/>
    <stop offset="100%" stop-color="#050816"/>
  </linearGradient>

  <radialGradient id="coreGlow">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/>
    <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="cyanPurple">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>

  <linearGradient id="pinkCyan">
    <stop offset="0%" stop-color="#EC4899"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect width="1200" height="560" rx="18" fill="url(#bg)"/>

<rect
  x="1"
