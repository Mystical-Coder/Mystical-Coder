<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
    <stop stop-color="#050816"></stop>
    <stop offset="0.55" stop-color="#0A1025"></stop>
    <stop offset="1" stop-color="#080B18"></stop>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22D3EE"></stop>
    <stop offset="1" stop-color="#67E8F9"></stop>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#8B5CF6"></stop>
    <stop offset="1" stop-color="#EC4899"></stop>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>

  <filter id="smallGlow">
    <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>

</defs>

