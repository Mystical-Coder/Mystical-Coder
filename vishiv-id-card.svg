<svg width="520" height="700" viewBox="0 0 520 700" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Card background -->
  <linearGradient id="cardBg" x1="40" y1="180" x2="480" y2="650">
    <stop offset="0%" stop-color="#120B2B"/>
    <stop offset="55%" stop-color="#160D32"/>
    <stop offset="100%" stop-color="#090817"/>
  </linearGradient>

  <!-- Neon border -->
  <linearGradient id="neonBorder" x1="50" y1="200" x2="470" y2="600">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="45%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#EC4899"/>
  </linearGradient>

  <!-- Name gradient -->
  <linearGradient id="nameGradient" x1="130" y1="0" x2="390" y2="0">
    <stop offset="0%" stop-color="#67E8F9"/>
    <stop offset="50%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#F472B6"/>
  </linearGradient>

  <!-- Lanyard gradient -->
  <linearGradient id="lanyardGradient" x1="180" y1="0" x2="330" y2="180">
    <stop offset="0%" stop-color="#EC4899"/>
    <stop offset="50%" stop-color="#F472B6"/>
    <stop offset="100%" stop-color="#DB2777"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <!-- Circular photo -->
  <clipPath id="photoClip">
    <circle cx="260" cy="325" r="72"/>
  </clipPath>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect width="520" height="700" fill="#030712"/>


<!-- ===================================================== -->
<!-- LANYARD -->
<!-- ===================================================== -->

<!-- Left strap -->

<path
  d="M190 0
     L220 0
     L242 175
     L215 175
     Z"
  fill="url(#lanyardGradient)"
/>

<!-- Right strap -->

<path
  d="M300 0
     L330 0
     L305 175
     L278 175
     Z"
  fill="url(#lanyardGradient)"
/>


<!-- Lanyard inner lines -->

<path
  d="M202 0 L227 170"
  stroke="#FBCFE8"
  stroke-opacity="0.35"
  stroke-width="2"
  stroke-dasharray="7 9"
/>

<path
  d="M318 0 L292 170"
  stroke="#FBCFE8"
  stroke-opacity="0.35"
  stroke-width="2"
  stroke-dasharray="7 9"
/>


<!-- Lanyard text -->

<text
  x="207"
  y="80"
  fill="#FFFFFF"
  opacity="0.9"
  font-family="monospace"
  font-size="8"
  font-weight="bold"
  transform="rotate(82 207 80)"
>
  AI • SOFTWARE • ENGINEERING
</text>


